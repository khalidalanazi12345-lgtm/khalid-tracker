name: Hevy to Tracker sync
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (public repo = free), Mac-independent
  workflow_dispatch:          # manual "Run workflow" button + gh workflow run
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync finished Hevy workouts to the tracker
        run: node .github/scripts/hevy-autolog.js
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          ENDPOINT: https://script.google.com/macros/s/AKfycbxfqJIjFZaBLJE4jjV6jJXELsLfvxFYq96l_V4ffCa3woLiBNYnb6qd0GxBu8b9FxjF/exec
